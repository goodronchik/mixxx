name: Build Signed Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Скачивание исходников Mixxx
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Установка окружения, скачивание vcpkg и сборка APK
        shell: bash
        run: |
          # 1. Запускаем скрипт настройки окружения (он задаст BUILDENV_URL и MIXXX_VCPKG_ROOT)
          source ./tools/android_buildenv.sh setup
          
          # 2. Скачиваем и распаковываем готовый архив зависимостей Mixxx (Qt6 + vcpkg для Android)
          if [ ! -d "${MIXXX_VCPKG_ROOT}" ]; then
            echo "Скачиваем зависимости из: ${BUILDENV_URL}"
            mkdir -p "${BUILDENV_BASEPATH}"
            curl -L --fail "${BUILDENV_URL}" -o "${BUILDENV_BASEPATH}/deps.zip"
            echo "${BUILDENV_SHA256}  ${BUILDENV_BASEPATH}/deps.zip" | sha256sum -c -
            unzip -q "${BUILDENV_BASEPATH}/deps.zip" -d "${BUILDENV_BASEPATH}"
            rm "${BUILDENV_BASEPATH}/deps.zip"
          fi
          
          # 3. Генерируем ключ для подписи APK
          keytool -genkey -noprompt \
            -keystore mixxx.keystore \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -keypass mylocalpassword \
            -storepass mylocalpassword \
            -dname "CN=MixxxAndroid"
            
          export QT_ANDROID_KEYSTORE_ALIAS=mixxx
          export QT_ANDROID_KEYSTORE_KEY_PASS=mylocalpassword
          export QT_ANDROID_KEYSTORE_PATH=$(pwd)/mixxx.keystore
          export QT_ANDROID_KEYSTORE_STORE_PASS=mylocalpassword
          
          # 4. Запускаем CMake ровно по инструкции из конца android_buildenv.sh
          mkdir build-android && cd build-android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            "${MIXXX_ROOT}"
            
          # 5. Компилируем APK
          cmake --build . --target apk --parallel $(nproc)

      - name: 3. Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Mixxx-Android-Signed-APK
          path: build-android/android-build/build/outputs/apk/**/*.apk
